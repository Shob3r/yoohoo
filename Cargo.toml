cargo-features = ["codegen-backend"]

[package]
name = "Elysiae"
version = "1.0.0"
authors = ["The Elysiae Project"]
rust-version = "1.99.0"
edition = "2024"

[dependencies]
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_22", "blueprint"] }

zstd = "0.13.3"
xz = "0.1.0"
flate2 = "1.1.9"
zip = "8.6.0"
tar = "0.4.46"
sysinfo = "0.39.5"
directories = "6.0.0"
anyhow = "1.0.104"
log = "0.4.33"
fs_extra = "1.3.0"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7.0"
tikv-jemalloc-ctl = "0.7.0"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
criterion = "0.8"
openssl = "0.10.81"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
incremental = true
panic = "abort"
codegen-backend = "cranelift"

