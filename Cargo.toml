cargo-features = ["codegen-backend"]

[package]
name = "Elysiae"
version = "1.0.0"
authors = ["The Elysiae Project"]
rust-version = "1.99.0"
edition = "2024"

[dependencies]
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_22", "blueprint"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

zstd = "0.13.3"
xz = "0.1.0"
flate2 = "1.1.9"
zip = "8.6.0"
tar = "0.4.46"
md-5 = "0.11.0"
fast-md5 = "1.0"
dashmap = { version = "6.2.1", features = ["serde"] }
hex = "0.4.3"
bytes = "1.12.0"
prost = "0.14.4"
lru = "0.18.0"
thiserror = "2.0.18"
sha2 = "0.11.0"
sysinfo = "0.39.5"
libc = "0.2.186"
twox-hash = "2.1.2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
rustc-hash = "2.1"
lz4 = "1.28.1"
tempfile = "3.27.0"
fs_extra = "1.3.0"
directories = "6.0.0"
anyhow = "1.0.104"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7.0"
tikv-jemalloc-ctl = "0.7.0"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
criterion = "0.8"
openssl = "0.10.81"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
incremental = true
panic = "abort"
codegen-backend = "cranelift"

