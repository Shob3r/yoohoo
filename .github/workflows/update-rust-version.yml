name: Update rust toolchain version

on:
    workflow_dispatch:
    push:
        paths:
            - ".github/workflows/update-rust-toolchain.yml"
    schedule: 
        - cron: "0 18 1 * *"

jobs:
    update:
        permissions:
            contents: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            
            - name: Update rust edition
              run: sed -i "s/^channel = .*/channel = \"nightly-$(date +%Y-%m-%d)\"/" ./rust-toolchain

            - name: Commit and push changes
              run: |
                git config --global user.name 'github-actions[bot]'
                git config --global user.email 'github-actions[bot]@users.noreply.github.com'
                git add ./rust-toolchain
                git diff-index --quiet HEAD || git commit -m "chore: update rust nightly version"
                git push origin HEAD:main
